name: Dvach Neo UI Audit

on:
  push:
    branches:
      - ai/dvach-v0.2
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: dvach-android
        run: gradle --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
      - name: Run app and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p audit
            adb install -r dvach-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop su.dvach.neo
            adb shell monkey -p su.dvach.neo -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell uiautomator dump /sdcard/boards.xml || true
            adb pull /sdcard/boards.xml audit/boards.xml || true
            adb exec-out screencap -p > audit/01-boards.png
            adb logcat -d -v time > audit/logcat-boards.txt
            adb shell input tap 540 520
            sleep 8
            adb shell uiautomator dump /sdcard/catalog.xml || true
            adb pull /sdcard/catalog.xml audit/catalog.xml || true
            adb exec-out screencap -p > audit/02-after-board-tap.png
            adb logcat -d -v time > audit/logcat-catalog.txt
            adb shell input tap 540 650
            sleep 8
            adb shell uiautomator dump /sdcard/thread.xml || true
            adb pull /sdcard/thread.xml audit/thread.xml || true
            adb exec-out screencap -p > audit/03-after-thread-tap.png
            adb shell input swipe 540 1750 540 450 500
            sleep 2
            adb exec-out screencap -p > audit/04-scrolled.png
            adb logcat -d -v time > audit/logcat-final.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dvach-ui-audit
          path: audit
          if-no-files-found: warn
