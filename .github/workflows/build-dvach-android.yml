name: Build Dvach Neo APK

on:
  push:
    branches:
      - ai/dvach-v0.3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20
          ls "$ANDROID_HOME/build-tools" | tail -20
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v0.3 source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dvach-android/app/src/main/java/su/dvach/neo/DvachUi.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import androidx.compose.material3.DarkColorScheme\n', '')
          s = s.replace('import androidx.compose.runtime.rememberSaveable\n', 'import androidx.compose.runtime.saveable.rememberSaveable\n')
          s = s.replace('import androidx.compose.runtime.rememberSaveableStateHolder\n', 'import androidx.compose.runtime.saveable.rememberSaveableStateHolder\n')
          s = s.replace('private val AppColors: DarkColorScheme = darkColorScheme(', 'private val AppColors = darkColorScheme(')
          old = '''CookieManager.getInstance().apply {
                            setAcceptCookie(true)
                            setAcceptThirdPartyCookies(this@apply.let { this@apply as? WebView } ?: this@apply, true)
                        }'''
          new = '''val cookies = CookieManager.getInstance()
                        cookies.setAcceptCookie(true)
                        cookies.setAcceptThirdPartyCookies(this, true)'''
          if old not in s:
              raise SystemExit('CookieManager patch target not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build debug APK
        working-directory: dvach-android
        run: gradle --no-daemon assembleDebug
      - name: Prepare artifact
        run: cp dvach-android/app/build/outputs/apk/debug/app-debug.apk dvach-neo-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dvach-neo-v0.3-apk
          path: dvach-neo-v0.3.0.apk
          if-no-files-found: error
