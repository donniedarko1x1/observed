name: Build Dvach Neo APK

on:
  push:
    branches:
      - ai/dvach-v0.3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20
          ls "$ANDROID_HOME/build-tools" | tail -20
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: dvach-android
        run: gradle --no-daemon assembleDebug
      - name: Prepare artifact
        run: cp dvach-android/app/build/outputs/apk/debug/app-debug.apk dvach-neo-v0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dvach-neo-v0.3-apk
          path: dvach-neo-v0.3.0.apk
          if-no-files-found: error
